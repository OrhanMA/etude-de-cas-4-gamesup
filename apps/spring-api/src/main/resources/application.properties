spring.application.name=gamesUP
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

# Connexion à la base de données MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gamesup}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate / JPA
# update : crée ou met à jour les tables à partir des entités Java
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecte Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}

# API Python de recommandation (FastAPI)
recommendation.api.base-url=${RECOMMENDATION_API_BASE_URL:http://localhost:8000}
recommendation.api.limit=${RECOMMENDATION_API_LIMIT:5}
recommendation.demo.password=${RECOMMENDATION_DEMO_PASSWORD:}
