spring.application.name=gamesUP

server.port=${SERVER_PORT:8080}

# Connexion a la base de donnees MySQL
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gamesup}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate / JPA
# update : cree ou met a jour automatiquement les tables selon vos entites Java
spring.jpa.hibernate.ddl-auto=update

# Afficher les requetes SQL dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecte Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
